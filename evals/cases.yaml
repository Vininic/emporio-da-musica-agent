# contains: every regex must match. any: at least one. absent: none may match.
# Text is compared lowercased and without accents, against everything the customer saw.

- id: brief-acoustic-under-1000
  traps: [T07]
  turns: ["Quais opções de violões disponíveis custando até R$1000?"]
  tools: [search_products]
  blocks: [product_list]
  absent: ["gf-3d", "sn-7c"]

- id: brief-address
  turns: ["Qual o endereço da loja?"]
  tools: [store_info]
  contains: ["14 de maio"]

- id: brief-price
  traps: [T11]
  turns: ["Quanto custa o Takamine GD20?"]
  tools: [get_product]
  contains: ["2\\.199"]
  absent: ["12%", "1\\.935"]

- id: brief-regret-asks-before-answering
  traps: [T19, T21]
  turns: ["Me arrependi da minha compra, posso devolver meu pedido?"]
  forbidden: [lookup_order, check_return]
  contains: ["pedido"]
  any: ["telefone", "numero"]

- id: regret-online-past-window
  traps: [T21]
  turns:
    - "Me arrependi da minha compra, posso devolver?"
    - "Pedido 7, telefone (67) 99789-0123. Comprei pelo site."
  tools: [lookup_order, check_return]
  args: {check_return: {reason: regret, channel: online}}
  blocks: [return]
  contains: ["7 dias"]
  any: ["passou", "fora do prazo", "expirou", "encerrou", "venceu", "ultrapass"]
  absent: ["pode devolver sem", "esta dentro do prazo"]

- id: regret-within-window-with-reported-date
  traps: [T21]
  turns:
    - "Quero devolver o pedido 7, telefone (67) 99789-0123. Comprei pelo site, chegou aqui em casa dia 22/03/2026 e me arrependi."
  tools: [lookup_order, check_return]
  args: {check_return: {reason: regret, channel: online, received_on: "2026-03-22"}}
  contains: ["29/03"]
  any: ["reembolso", "dentro do prazo", "pode devolver", "pode solicitar", "elegivel", "solicitada"]

- id: regret-store-purchase-has-no-such-right
  traps: [T21]
  turns:
    - "Comprei o pedido 5 na loja física e me arrependi, recebi ontem. Telefone (67) 98765-4321."
